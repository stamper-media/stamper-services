# @stamper/* come from npm once published. Until then they install from the tarballs in
# vendor/, packed by stamper-protocol (scripts/sync-protocol.sh refreshes them). When the
# packages are on npm: delete this block and vendor/, then run pnpm install.
overrides:
  "@stamper/contracts-abi": "file:./vendor/stamper-contracts-abi.tgz"
  "@stamper/core": "file:./vendor/stamper-core.tgz"
  "@stamper/foc": "file:./vendor/stamper-foc.tgz"
  "@stamper/marking": "file:./vendor/stamper-marking.tgz"
  "@stamper/minimise": "file:./vendor/stamper-minimise.tgz"
